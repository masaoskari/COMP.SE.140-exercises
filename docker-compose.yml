services:
  service1:
    build: ./service1
    depends_on:
      - service2
    deploy:
      replicas: 3
    environment:
      - PORT=8081
      - SERVICE2_URL=http://service2:5000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - test-network

  service2:
    build: ./service2
    networks:
      - test-network

  nginx:
    build: ./nginx
    ports:
      - "8198:8198"
    depends_on:
      - service1
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
