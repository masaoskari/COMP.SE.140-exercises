stages:
  - integration-test

integration-test:
  image: docker:latest
  stage: integration-test
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  tags:
    - docker-runner
  before_script:
    - apk add --no-cache nodejs npm
  script:
    - docker-compose -f docker-compose.yml up -d
    - sleep 20
    - curl -v http://nginx:8198/
    - cd service1/test
    - npm install supertest jest
    - npx jest integration.test.ts
    - docker-compose -f docker-compose.yml down
