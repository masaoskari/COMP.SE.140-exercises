stages:
  - deploy
  - integration-test

deploy:
  image: docker:latest
  stage: deploy
  tags:
    - docker-runner
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache docker-compose
  script:
    - docker-compose -f docker-compose.yml up -d --build

integration-test:
  image: node:21
  stage: integration-test
  services:
    - docker:dind
  tags:
    - docker-runner
  script:
    - cd service1/test
    - npm install supertest jest
    - npx jest integration.test.ts
