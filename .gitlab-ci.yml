stages:
  - test

test:
  image: docker:latest
  stage: test
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  tags:
    - docker-runner
  script:
    - docker-compose -f docker-compose.yml up -d
    - docker-compose -f docker-compose-test.yml up --build --exit-code-from test-container
