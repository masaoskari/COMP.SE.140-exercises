stages:
  - integration-test

integration-test:
  image: docker:latest
  stage: integration-test
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  tags:
    - docker-runner
  before_script:
    - apk add --no-cache nodejs npm curl
  script:
    - docker network create --driver bridge test-network
    - docker-compose -f docker-compose.yml up -d
    - docker-compose ps
    - docker-compose logs nginx
    - docker network ls
    - until curl -s http://nginx:8198 > /dev/null; do echo "Waiting for Nginx..."; sleep 5; done
    - cd service1/test
    - npm install supertest jest
    - npx jest integration.test.ts
    - docker-compose -f docker-compose.yml down
