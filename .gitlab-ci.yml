stages:
  - test

e2e-test:
  image: docker:latest
  stage: test
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  tags:
    - docker-runner
  script:
    - docker-compose -f docker-compose.yml -f docker-compose-test.yml up --build --abort-on-container-exit --exit-code-from test-container
  after_script:
    - docker-compose -f docker-compose.yml -f docker-compose-test.yml down
