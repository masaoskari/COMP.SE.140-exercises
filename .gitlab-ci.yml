image: node:21

before_script:
  - apt-get update
  - apt-get install -y python3 python3-pip

stages:
  - test

test:
  stage: test
  tags:
    - docker-runner
  script:
    # Install Node.js dependencies for service1
    - cd service1
    - npm install
    # Run Jest tests for service1
    - npm test
    # Install Python dependencies for service2
    - cd ../service2
    - pip3 install -r requirements.txt
    # Run pytest tests for service2
    - pytest