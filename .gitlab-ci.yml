stages:
  - integration-test

integration-test:
  image: docker:latest
  stage: integration-test
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  tags:
    - docker-runner
  before_script:
    - apk add --no-cache nodejs npm curl
    - docker network create --driver bridge test-network
  script:
    - docker-compose -f docker-compose.yml up -d
    - docker-compose ps
    - docker-compose logs nginx
    - docker network ls
    - docker run --rm --network test-network node:latest sh -c "apk add --no-cache curl && until curl -s http://nginx:8198 > /dev/null; do echo 'Waiting for Nginx...'; sleep 5; done"
    - docker-compose -f docker-compose.yml down
