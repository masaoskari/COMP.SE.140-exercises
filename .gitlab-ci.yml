stages:
  - build
  - test

build:
  image: docker:latest
  stage: build
  tags:
    - docker-runner
  services:
    - docker:dind
  script:
    - docker-compose -f docker-compose.yml up -d --build

test:
    image: node:latest
    stage: test
    tags:
        - docker-runner
    script:
        - cd service1
        - npm install
        - npm run test