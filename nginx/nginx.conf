upstream services {
    server service1:8199;
}

server {
    listen 8081;
    
    include /etc/nginx/mime.types;

    location /api {
        proxy_pass http://services/;
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location /api/stop {
        proxy_pass http://services/stop;
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location / {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx/html/;
        index index.html;
    }
}