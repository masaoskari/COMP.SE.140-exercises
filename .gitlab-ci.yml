stages:
  - lint
  - unit-test
  - build
  - e2e-test
  - release
  - deploy

default:
  tags:
    - docker-runner

pylint:
  image: python:3.12-bullseye
  stage: lint
  script:
    - cd service2
    - python -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - pip install pylint==3.3.3
    - pylint *.py

eslint:
  image: node:21-alpine
  stage: lint
  script:
    - npm install @eslint/js@9.17.0 eslint@9.17.0 globals@15.14.0 typescript-eslint@8.18.2
    - npx eslint

jest-test:
  image: node:21-alpine
  stage: unit-test
  script:
    - cd service1
    - npm ci
    - npm run test

pytest:
  image: python:3.12-bullseye
  stage: unit-test
  script:
    - cd service2
    - python -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - pytest

build:
  image: docker:27.4.1
  stage: build
  services:
    - docker:27.4.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: "" # Disables TLS verification
  script:
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker compose -f docker-compose.yml build
    - for service in service1 service2 nginx gateway; do
      docker tag compse140-project-$service $CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA;
      docker push $CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA;
      done

browser-endpoint-test:
  image: docker:27.4.1
  stage: e2e-test
  services:
    - docker:27.4.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  tags:
    - docker-runner
  script:
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker compose -f docker-compose.yml -f docker-compose-prod.yml up -d --build
    - export TEST_COMMAND="npm run test:browser" && docker-compose -f docker-compose-test.yml up --build --abort-on-container-exit --exit-code-from test-container
  after_script:
    - docker compose -f docker-compose.yml -f docker-compose-prod.yml down
    - docker compose -f docker-compose-test.yml down

state-api-test:
  image: docker:27.4.1
  stage: e2e-test
  services:
    - docker:27.4.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  tags:
    - docker-runner
  script:
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker compose -f docker-compose.yml -f docker-compose-prod.yml up -d --build
    - export TEST_COMMAND="npm run test:state-api" && docker-compose -f docker-compose-test.yml up --build --abort-on-container-exit --exit-code-from test-container
  after_script:
    - docker compose -f docker-compose.yml -f docker-compose-prod.yml down
    - docker compose -f docker-compose-test.yml down

# The release images job push (release) images to the GitLab registry after the tests have passed.
release-images:
  image: docker:27.4.1
  stage: release
  services:
    - docker:27.4.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - for service in service1 service2 nginx gateway; do
      docker pull $CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA;
      docker tag $CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/$service:latest;
      docker push $CI_REGISTRY_IMAGE/$service:latest;
      done

deploy:
  image: alpine:latest
  stage: deploy
  before_script:
    # Install ssh client and configure ssh key
    - apk update && apk add openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan $SERVER_HOST >> ~/.ssh/known_hosts

  script:
    # Update the docker-compose-prod.yml file with the latest image tag
    - sed -i "s/\${CI_COMMIT_SHA}/latest/g" docker-compose-prod.yml
    - ssh $SERVER_USER@$SERVER_HOST "echo \"$CI_JOB_TOKEN\" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin"
    # Move docker compose files to the server
    - scp docker-compose-prod.yml $SERVER_USER@$SERVER_HOST:docker-compose-prod.yml
    - scp docker-compose.yml $SERVER_USER@$SERVER_HOST:docker-compose.yml
    # Close the running containers, remove unused images, and start the new containers
    - ssh $SERVER_USER@$SERVER_HOST "docker compose -f docker-compose.yml -f docker-compose-prod.yml down"
    - ssh $SERVER_USER@$SERVER_HOST "docker image prune -af"
    - ssh $SERVER_USER@$SERVER_HOST "docker compose -f docker-compose.yml -f docker-compose-prod.yml up -d"
    - ssh $SERVER_USER@$SERVER_HOST "docker system prune -af"
