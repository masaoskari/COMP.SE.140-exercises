<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NGINX handson</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .centered-container {
        text-align: center;
      }
      #serviceInfo {
        height: 20px;
        margin: 0;
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="centered-container">
      <p id="serviceInfo"></p>
      <br />
      <textarea id="responseArea" rows="20" cols="100"></textarea>
      <br />
      <button id="reqButton">REQUEST</button>
      <button id="stopButton">STOP</button>
    </div>
  </body>
  <script>
    const reqButton = document.getElementById("reqButton");
    const stopButton = document.getElementById("stopButton");
    const responseArea = document.getElementById("responseArea");
    const serviceInfo = document.getElementById("serviceInfo");

    let isRequestInProgress = false;

    reqButton.onclick = () => handleRequest("/api");
    stopButton.onclick = () => handleRequest("/api/stop", { method: "POST" });

    async function handleRequest(url, options = {}) {
      if (isRequestInProgress) {
        serviceInfo.innerText =
          "Services are busy. Wait a second and try again!";
        return;
      }
      isRequestInProgress = true;
      try {
        const response = await fetch(url, {
          signal: AbortSignal.timeout(2000),
          ...options,
        });
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.text();
        responseArea.value = data;
      } catch (error) {
        // Ignore timeout errors but show other errors. We just don't want to wait
        // each request forever. User can make new request when the services are again up.
        if (error.name !== "TimeoutError") {
          responseArea.value = `Error: ${error.message}`;
        }
      } finally {
        isRequestInProgress = false;
        serviceInfo.innerText = "";
      }
    }
  </script>
</html>
